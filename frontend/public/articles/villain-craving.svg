<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3a1018" />
      <stop offset="45%" stop-color="#1e090f" />
      <stop offset="85%" stop-color="#0d0407" />
      <stop offset="100%" stop-color="#050203" />
    </radialGradient>
    <radialGradient id="candleGlow" cx="50%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGlow)" />
  <rect width="1200" height="675" fill="url(#candleGlow)" />

  <!-- Outer Ornate Frame -->
  <rect x="36" y="36" width="1128" height="603" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" opacity="0.65" />
  <rect x="46" y="46" width="1108" height="583" fill="none" stroke="url(#goldGradient)" stroke-width="0.7" opacity="0.35" stroke-dasharray="6,4" />

  <!-- Corner Flourishes -->
  <g stroke="url(#goldGradient)" stroke-width="1.5" fill="none" opacity="0.8">
    <!-- Top Left -->
    <path d="M 36,75 L 75,75 L 75,36" />
    <circle cx="75" cy="75" r="4" fill="url(#goldGradient)" />
    <!-- Top Right -->
    <path d="M 1164,75 L 1125,75 L 1125,36" />
    <circle cx="1125" cy="75" r="4" fill="url(#goldGradient)" />
    <!-- Bottom Left -->
    <path d="M 36,600 L 75,600 L 75,639" />
    <circle cx="75" cy="600" r="4" fill="url(#goldGradient)" />
    <!-- Bottom Right -->
    <path d="M 1164,600 L 1125,600 L 1125,639" />
    <circle cx="1125" cy="600" r="4" fill="url(#goldGradient)" />
  </g>

  <!-- Gothic Architectural Arches in Background -->
  <g stroke="#2d0f17" stroke-width="2.5" fill="none" opacity="0.45">
    <path d="M 350,560 C 350,300 480,160 600,100 C 720,160 850,300 850,560" />
    <path d="M 400,560 C 400,340 500,220 600,160 C 700,220 800,340 800,560" />
    <path d="M 200,560 C 200,360 280,260 380,210" />
    <path d="M 1000,560 C 1000,360 920,260 820,210" />
  </g>

  <!-- Dramatic Shadow of the Anti-Hero / Villain -->
  <g opacity="0.85" filter="url(#shadowGlow)">
    <!-- Villain Cloak Silhouette -->
    <path d="M 600,135 
             C 560,135 530,170 515,225 
             C 470,260 410,340 375,445 
             C 350,520 330,590 320,620 
             L 880,620 
             C 870,590 850,520 825,445 
             C 790,340 730,260 685,225 
             C 670,170 640,135 600,135 Z" fill="#070204" />
    
    <!-- Villain Head & Crown Silhouette -->
    <path d="M 570,175 C 570,150 583,130 600,130 C 617,130 630,150 630,175 C 630,195 617,212 600,212 C 583,212 570,195 570,175 Z" fill="#040102" />
    <!-- Ornate Jagged Dark Crown -->
    <polygon points="565,145 575,115 588,135 600,105 612,135 625,115 635,145 600,140" fill="url(#goldGradient)" opacity="0.85" />
    
    <!-- Glowing Crimson Eyes -->
    <ellipse cx="590" cy="170" rx="3.5" ry="1.8" fill="#ef4444" opacity="0.9" />
    <ellipse cx="610" cy="170" rx="3.5" ry="1.8" fill="#ef4444" opacity="0.9" />
  </g>

  <!-- Foreground: Open Ancient Grimoire / Novel on Altar -->
  <g>
    <!-- Table / Altar surface -->
    <rect x="250" y="555" width="700" height="75" rx="4" fill="#120508" stroke="#38101a" stroke-width="2" />
    <line x1="250" y1="562" x2="950" y2="562" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.5" />

    <!-- Open Book Pages Left & Right -->
    <!-- Left Page -->
    <path d="M 600,530 C 530,510 440,510 370,525 L 350,560 C 420,545 520,545 600,565 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <path d="M 600,535 C 535,516 445,516 375,530 L 358,563 C 426,549 524,549 600,568 Z" fill="#fde68a" opacity="0.7" />
    <!-- Right Page -->
    <path d="M 600,530 C 670,510 760,510 830,525 L 850,560 C 780,545 680,545 600,565 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <path d="M 600,535 C 665,516 755,516 825,530 L 842,563 C 774,549 676,549 600,568 Z" fill="#fde68a" opacity="0.7" />

    <!-- Text Lines on Pages -->
    <g stroke="#78350f" stroke-width="1.3" opacity="0.6">
      <line x1="400" y1="532" x2="570" y2="528" />
      <line x1="410" y1="540" x2="575" y2="536" />
      <line x1="395" y1="548" x2="565" y2="544" />
      <line x1="630" y1="528" x2="800" y2="532" />
      <line x1="625" y1="536" x2="790" y2="540" />
      <line x1="635" y1="544" x2="805" y2="548" />
    </g>

    <!-- Crimson Rose & Dagger resting on book -->
    <line x1="565" y1="505" x2="635" y2="570" stroke="url(#bladeGrad)" stroke-width="3" />
    <circle cx="560" cy="500" r="14" fill="#991b1b" stroke="#ef4444" stroke-width="1" />
    <circle cx="558" cy="498" r="8" fill="#b91c1c" />
    <circle cx="556" cy="496" r="4" fill="#f87171" />
  </g>

  <!-- Subtle Literary Smoke / Whispers floating up -->
  <g stroke="url(#goldGradient)" stroke-width="1" fill="none" opacity="0.3">
    <path d="M 520,510 C 490,460 550,420 510,360 C 480,310 520,260 490,210" stroke-dasharray="3,3" />
    <path d="M 680,510 C 710,460 650,420 690,360 C 720,310 680,260 710,210" stroke-dasharray="3,3" />
  </g>

  <!-- Typography Overlay Header -->
  <text x="600" y="88" font-family="'Fraunces', serif" font-size="21" font-weight="700" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="4">THE SHADOW ARCHETYPE</text>
  <text x="600" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle" letter-spacing="2">PSYCHOLOGY OF THE LITERARY ANTI-HERO</text>
</svg>
